name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Django
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: forked_nuces
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forked_nuces"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ENVIRONMENT: test
      DB_NAME: forked_nuces
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/1
      SECRET_KEY: ci-only-not-a-production-secret-7cda7cfd467a4d61b46e348d84e9042c
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check for missing model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to a clean PostgreSQL database
        run: python manage.py migrate --noinput
      - name: Run Django system checks
        run: python manage.py check
      - name: Run backend tests
        run: python manage.py test --verbosity 2
      - name: Run Django deployment checks
        env:
          ENVIRONMENT: production
          ALLOWED_HOSTS: api.ci.invalid
          CORS_ALLOWED_ORIGINS: https://app.ci.invalid
          CSRF_TRUSTED_ORIGINS: https://app.ci.invalid,https://api.ci.invalid
          FRONTEND_BASE_URL: https://app.ci.invalid
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.ci.invalid
          EMAIL_PORT: "587"
          EMAIL_HOST_USER: noreply@ci.invalid
          EMAIL_HOST_PASSWORD: ci-only-smtp-password
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend / Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    env:
      DRF_API_BASE_URL: https://api.example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: forked_nuces_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forked_nuces_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ENVIRONMENT: test
      DB_NAME: forked_nuces_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/2
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:3000
      FRONTEND_BASE_URL: http://127.0.0.1:3000
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
      DRF_API_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      E2E_USER_EMAIL: e2e.verified@nu.edu.pk
      E2E_USER_NAME: E2E Verified User
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install backend dependencies
        working-directory: server
        run: python -m pip install --requirement requirements.txt
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Apply database migrations
        working-directory: server
        run: python manage.py migrate --noinput
      - name: Generate ephemeral browser-test credentials
        shell: bash
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$password"
          echo "E2E_USER_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Seed the verified E2E user
        working-directory: server
        shell: bash
        run: |
          python manage.py shell <<'PY'
          import os

          from accounts.models import User

          email = os.environ["E2E_USER_EMAIL"].strip().lower()
          full_name = os.environ["E2E_USER_NAME"].strip()
          password = os.environ["E2E_USER_PASSWORD"]
          user, _ = User.objects.get_or_create(
              nu_email=email,
              defaults={"full_name": full_name},
          )
          user.full_name = full_name
          user.is_active = True
          user.is_email_verified = True
          user.set_password(password)
          user.save()
          PY
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      - name: Install Chromium and operating-system dependencies
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Start Django
        working-directory: server
        shell: bash
        run: >-
          nohup python manage.py runserver 127.0.0.1:8000 --noreload
          </dev/null >"$RUNNER_TEMP/django-e2e.log" 2>&1 &
      - name: Wait for Django readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ready/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/django-e2e.log"
          exit 1
      - name: Start Next.js
        working-directory: client
        shell: bash
        run: >-
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000
          </dev/null >"$RUNNER_TEMP/next-e2e.log" 2>&1 &
      - name: Wait for Next.js readiness
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/next-e2e.log"
          exit 1
      - name: Run browser tests
        working-directory: client
        run: npm run test:e2e -- --project=chromium
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-e2e-failure-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            client/playwright-report/
            client/test-results/
            ${{ runner.temp }}/django-e2e.log
            ${{ runner.temp }}/next-e2e.log

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement server/requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Audit Node dependencies
        working-directory: client
        run: |
          npm ci
          npm audit --audit-level=high

  container:
    name: Container and proxy config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup automation syntax
        run: bash -n ops/backup-postgres.sh
      - name: Validate Compose interpolation
        env:
          ENVIRONMENT: production
          DB_PASSWORD: ci-database-password
          SECRET_KEY: ci-only-not-a-production-secret-7cda7cfd467a4d61b46e348d84e9042c
          API_DOMAIN: api.example.com
          ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
          CSRF_TRUSTED_ORIGINS: https://app.example.com,https://api.example.com
          FRONTEND_BASE_URL: https://app.example.com
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST_USER: noreply@example.com
          EMAIL_HOST_PASSWORD: ci-only-smtp-password
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
        run: docker compose --profile production config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env API_DOMAIN=api.example.com
          --volume "${PWD}/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build backend image
        run: docker build --tag forked-nuces-backend:ci ./server
      - name: Verify non-root runtime and excluded secrets
        run: |
          test "$(docker image inspect forked-nuces-backend:ci --format '{{.Config.User}}')" = "app"
          docker run --rm --entrypoint sh forked-nuces-backend:ci -c 'test ! -e /app/.env'
