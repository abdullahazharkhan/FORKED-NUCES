name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Django
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: forked_nuces
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forked_nuces"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ENVIRONMENT: test
      DB_NAME: forked_nuces
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/1
      SECRET_KEY: ci-only-not-a-production-secret-7cda7cfd467a4d61b46e348d84e9042c
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check for missing model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to a clean PostgreSQL database
        run: python manage.py migrate --noinput
      - name: Run Django system checks
        run: python manage.py check
      - name: Run backend tests
        run: python manage.py test --verbosity 2
      - name: Run Django deployment checks
        env:
          ENVIRONMENT: production
          ALLOWED_HOSTS: api.ci.invalid
          CORS_ALLOWED_ORIGINS: https://app.ci.invalid
          CSRF_TRUSTED_ORIGINS: https://app.ci.invalid,https://api.ci.invalid
          FRONTEND_BASE_URL: https://app.ci.invalid
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.ci.invalid
          EMAIL_PORT: "587"
          EMAIL_HOST_USER: noreply@ci.invalid
          EMAIL_HOST_PASSWORD: ci-only-smtp-password
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend / Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    env:
      DRF_API_BASE_URL: https://api.example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement server/requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Audit Node dependencies
        working-directory: client
        run: |
          npm ci
          npm audit --audit-level=high

  container:
    name: Container and proxy config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup automation syntax
        run: bash -n ops/backup-postgres.sh
      - name: Validate Compose interpolation
        env:
          ENVIRONMENT: production
          DB_PASSWORD: ci-database-password
          SECRET_KEY: ci-only-not-a-production-secret-7cda7cfd467a4d61b46e348d84e9042c
          API_DOMAIN: api.example.com
          ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
          CSRF_TRUSTED_ORIGINS: https://app.example.com,https://api.example.com
          FRONTEND_BASE_URL: https://app.example.com
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST_USER: noreply@example.com
          EMAIL_HOST_PASSWORD: ci-only-smtp-password
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
        run: docker compose --profile production config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env API_DOMAIN=api.example.com
          --volume "${PWD}/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build backend image
        run: docker build --tag forked-nuces-backend:ci ./server
      - name: Verify non-root runtime and excluded secrets
        run: |
          test "$(docker image inspect forked-nuces-backend:ci --format '{{.Config.User}}')" = "app"
          docker run --rm --entrypoint sh forked-nuces-backend:ci -c 'test ! -e /app/.env'
